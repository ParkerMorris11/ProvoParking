# Runs on every pull request so a broken change is caught before it reaches main.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every JS file
        run: for f in $(find js -name '*.js'); do node --check "$f"; done
      - name: Unit tests
        run: npm test
